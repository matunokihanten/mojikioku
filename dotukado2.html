<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>右脳覚醒：ドッツトレーニング Pro MAX 3D</title>
    <style>
        * { box-sizing: border-box; touch-action: manipulation; }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100dvh;
            margin: 0;
            padding: 5px;
            font-family: 'Segoe UI', 'Meiryo', sans-serif;
            background: #000;
            color: #E0E0E0;
            overflow: hidden;
        }
        .screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
        }
        .hidden { display: none !important; }

        /* 設定画面のコンパクト化 (スクロール対応) */
        #setup-screen {
            justify-content: flex-start;
            padding: 2px;
            overflow-y: auto;
        }
        .setup-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 10px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 20px;
        }
        .setup-card h2 {
            font-size: 1.1rem;
            margin: 0 0 5px 0;
            text-align: center;
        }
        .setup-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 3px;
        }
        .setup-group:last-of-type {
            border-bottom: none;
            padding-bottom: 0;
        }
        .setup-group label {
            font-size: 0.75rem;
            color: #ADD8E6;
            font-weight: bold;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 5px;
        }
        .setup-group select, .setup-group input {
            background: #222;
            border: 1px solid #444;
            color: #fff;
            padding: 2px 4px;
            border-radius: 4px;
            font-size: 0.8rem;
            height: 26px;
            width: 55%;
        }
        .minmax-group {
            display: flex;
            width: 55%;
            gap: 5px;
            align-items: center;
        }
        .minmax-group input {
            width: 100%;
        }

        #game-screen { justify-content: space-between; }
        #stats {
            font-size: 1rem;
            color: #00FFFF;
            padding: 2px 0;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
        }
        #canvas {
            position: relative;
            width: 100%;
            max-width: 400px;
            flex: 1;
            min-height: 150px;
            border: 2px solid #66FFFF;
            box-shadow: 0 0 15px rgba(102, 255, 255, 0.2);
            margin: 5px 0;
            overflow: hidden;
            border-radius: 10px;
            transition: background-color 0.1s;
            perspective: 800px;
            transform-style: preserve-3d;
        }
        #comparison-line {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            background: rgba(102, 255, 255, 0.3);
            display: none;
            z-index: 1;
        }
        .dot {
            position: absolute;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.6);
            transition: opacity 0.1s ease-out;
            z-index: 10;
        }
        .gabor {
            background-size: 100% 100%;
            -webkit-mask-image: radial-gradient(circle, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 70%);
            mask-image: radial-gradient(circle, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 70%);
            box-shadow: none !important;
        }
        #stroop-noise {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 120px;
            font-weight: 900;
            color: rgba(255, 0, 0, 0.5);
            z-index: 5;
            pointer-events: none;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.3);
            transition: opacity 0.1s ease-out;
        }
        #mask {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-conic-gradient(#fff 0% 25%, #000 0% 50%) 50% / 20px 20px;
            z-index: 100;
            display: none;
            pointer-events: none;
        }
        #msg {
            min-height: 1.5rem;
            font-size: 1.1rem;
            font-weight: bold;
            text-align: center;
            padding: 2px 0;
            color: #FFD700;
        }
        #target-info {
            font-size: 0.85rem;
            color: #ADD8E6;
            height: 1.2rem;
            text-align: center;
            font-weight: bold;
        }
        #answerArea {
            width: 100%;
            max-width: 400px;
            display: grid;
            gap: 4px;
            margin-bottom: 5px;
        }
        .grid-small { grid-template-columns: repeat(5, 1fr); }
        .grid-keypad { grid-template-columns: repeat(3, 1fr); }
        .grid-compare { grid-template-columns: 1fr 1fr; }
        .btn-ans {
            height: 40px;
            font-size: 1.1rem;
            font-weight: bold;
            background: rgba(102, 255, 255, 0.1);
            color: #E0E0E0;
            border: 1px solid #66FFFF;
            border-radius: 8px;
        }
        .btn-ans:active { background: #66FFFF; color: #000; }
        .btn-large { height: 50px; font-size: 1.2rem; }
        #displayFieldValue {
            grid-column: span 3;
            background: #000;
            color: #00FFFF;
            font-size: 1.2rem;
            text-align: center;
            border: 1px solid #66FFFF;
            border-radius: 8px;
            margin-bottom: 2px;
            height: 34px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .controls {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 400px;
            padding: 2px 0 5px 0;
        }
        .btn-main {
            flex: 1;
            padding: 10px;
            font-size: 0.95rem;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
        }
        #startBtn { background: #00d2ff; color: #000; margin-top: 5px; }
        #backToSetup { background: #444; color: #fff; }
    </style>
</head>
<body>
    <div id="setup-screen" class="screen">
        <div class="setup-card">
            <h2 style="color:#00FFFF;">脳トレ設定 Pro 3D</h2>
            <div class="setup-group">
                <label>モード</label>
                <select id="gameMode">
                    <option value="normal" selected>通常 (固定)</option>
                    <option value="levelup">LvUp (10連勝で増)</option>
                </select>
            </div>
            <div class="setup-group">
                <label>ガボールパッチ</label>
                <select id="gaborMode">
                    <option value="off" selected>OFF</option>
                    <option value="on">ON (縞模様)</option>
                </select>
            </div>
            <div class="setup-group">
                <label>大小比較</label>
                <select id="compareMode">
                    <option value="off" selected>OFF</option>
                    <option value="on">ON (左右比較)</option>
                </select>
            </div>
            <div class="setup-group">
                <label>残像定着</label>
                <select id="afterimageMode">
                    <option value="off" selected>OFF</option>
                    <option value="on">ON (白フラッシュ)</option>
                </select>
            </div>
            <div class="setup-group">
                <label>N-Back (記憶)</label>
                <select id="nBackMode">
                    <option value="0" selected>OFF</option>
                    <option value="1">1-Back (1つ前)</option>
                    <option value="2">2-Back (2つ前)</option>
                    <option value="3">3-Back (3つ前)</option>
                </select>
            </div>
            <div class="setup-group">
                <label>ストループノイズ</label>
                <select id="stroopMode">
                    <option value="off" selected>OFF</option>
                    <option value="on">ON (邪魔な数字)</option>
                </select>
            </div>
            <div class="setup-group">
                <label>ディストラクター</label>
                <select id="distractorMode">
                    <option value="off" selected>OFF</option>
                    <option value="color">色違い (無視)</option>
                    <option value="shape">形違い (無視)</option>
                </select>
            </div>
            <div class="setup-group">
                <label>マスキング</label>
                <select id="visualMaskMode">
                    <option value="off" selected>OFF</option>
                    <option value="on">ON (残像消去)</option>
                </select>
            </div>
            <div class="setup-group">
                <label>次元</label>
                <select id="dimensionMode">
                    <option value="2d" selected>2D (平面)</option>
                    <option value="3d">3D (空間)</option>
                </select>
            </div>
            <div class="setup-group">
                <label>表示時間(秒)</label>
                <select id="flashTime">
                    <option value="0.05">0.05 (超神速)</option>
                    <option value="0.1">0.1 (神速)</option>
                    <option value="0.3">0.3 (超難問)</option>
                    <option value="0.5" selected>0.5 (推奨)</option>
                    <option value="999">消さない</option>
                </select>
            </div>
            <div class="setup-group">
                <label>玉数 (最小-最大)</label>
                <div class="minmax-group">
                    <input type="number" id="minDots" value="1" min="1">
                    <span style="color:#888;">-</span>
                    <input type="number" id="maxDots" value="10" min="1">
                </div>
            </div>
            <div class="setup-group">
                <label>サイズ調整</label>
                <select id="sizeMode">
                    <option value="dynamic" selected>可変 (自動縮小)</option>
                    <option value="fixed">固定 (段階調整)</option>
                </select>
            </div>
            <div class="setup-group">
                <label>カラーノイズ</label>
                <select id="colorNoise">
                    <option value="off" selected>OFF</option>
                    <option value="on">ON (ランダム色)</option>
                </select>
            </div>
            <div class="setup-group">
                <label>配置パターン</label>
                <select id="layoutPattern">
                    <option value="random" selected>ランダム</option>
                    <option value="grid">グリッド</option>
                </select>
            </div>
            <button id="startBtn" class="btn-main" onclick="startTraining()">トレーニング開始</button>
        </div>
    </div>

    <div id="game-screen" class="screen hidden">
        <div id="stats">Combo: 0</div>
        <div id="target-info"></div>
        <div id="canvas" onclick="drawDotsNext()">
            <div id="comparison-line"></div>
            <div id="mask"></div>
        </div>
        <div id="msg"></div>
        <div id="answerArea"></div>
        <div class="controls">
            <button id="backToSetup" class="btn-main" onclick="showSetup()">設定に戻る</button>
            <button id="nextBtn" class="btn-main" style="background:#00d2ff; color:#000;" onclick="drawDotsNext()">次へ (Enter)</button>
        </div>
    </div>

    <script>
        let correctCount = 0;
        let nBackHistory = [];
        let combo = 0;
        let isWaitingAnswer = false;
        let isTransitioning = false;
        let currentInput = "";
        let config = {};

        function startTraining() {
            config = {
                mode: document.getElementById('gameMode').value,
                gabor: document.getElementById('gaborMode').value === 'on',
                compare: document.getElementById('compareMode').value === 'on',
                afterimage: document.getElementById('afterimageMode').value === 'on',
                nBack: parseInt(document.getElementById('nBackMode').value),
                stroop: document.getElementById('stroopMode').value === 'on',
                distractor: document.getElementById('distractorMode').value,
                visualMask: document.getElementById('visualMaskMode').value === 'on',
                dimension: document.getElementById('dimensionMode').value,
                flashTime: parseFloat(document.getElementById('flashTime').value),
                minDots: parseInt(document.getElementById('minDots').value),
                maxDots: parseInt(document.getElementById('maxDots').value),
                sizeMode: document.getElementById('sizeMode').value,
                colorNoise: document.getElementById('colorNoise').value === 'on',
                layoutPattern: document.getElementById('layoutPattern').value
            };
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            combo = 0; nBackHistory = []; updateStats(); generateNewProblem();
        }

        function showSetup() {
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('setup-screen').classList.remove('hidden');
            isWaitingAnswer = false; isTransitioning = false;
        }

        window.addEventListener('keydown', (e) => {
            if (document.getElementById('game-screen').classList.contains('hidden')) return;
            if (e.key === 'Enter') drawDotsNext();
            if (!isWaitingAnswer || isTransitioning) return;
            if (config.compare) {
                if (e.key === 'ArrowLeft') checkAnswer('LEFT');
                if (e.key === 'ArrowRight') checkAnswer('RIGHT');
                return;
            }
            const buttonCount = config.maxDots - config.minDots + 1;
            if (e.key >= '0' && e.key <= '9') {
                if (buttonCount <= 10) checkAnswer(parseInt(e.key)); else addNumber(e.key);
            }
            if (e.key === 'Backspace') backspace();
        });

        function drawDotsNext() {
            if (isTransitioning) return;
            if (isWaitingAnswer) revealAnswerAndNext(); else generateNewProblem();
        }

        function revealAnswerAndNext() {
            isTransitioning = true; isWaitingAnswer = false;
            document.querySelectorAll(".dot, #stroop-noise").forEach(d => d.style.opacity = "1");
            const msg = document.getElementById("msg");
            msg.style.color = "#00FFFF"; msg.textContent = `正解を表示中...`;
            setTimeout(generateNewProblem, 300);
        }

        function generateNewProblem() {
            isTransitioning = false;
            const canvas = document.getElementById("canvas");
            const targetInfo = document.getElementById("target-info");
            const mask = document.getElementById("mask");
            const compLine = document.getElementById("comparison-line");
            
            canvas.querySelectorAll('.dot, #stroop-noise').forEach(d => d.remove());
            mask.style.display = "none"; compLine.style.display = config.compare ? "block" : "none";
            document.getElementById("msg").textContent = ""; currentInput = "";

            let currentBg = "#000", baseColorH = 0;
            if (config.colorNoise) {
                const colors = ["#000", "#000033", "#1a001a", "#001a00"];
                currentBg = colors[Math.floor(Math.random() * colors.length)];
                baseColorH = Math.floor(Math.random() * 360);
            }
            canvas.style.backgroundColor = currentBg;

            let currentDotsToShow;
            if (config.compare) {
                let left = Math.floor(Math.random() * (config.maxDots - config.minDots + 1)) + config.minDots;
                let diffs = [-2, -1, 1, 2].filter(d => (left + d) >= config.minDots && (left + d) <= config.maxDots);
                let right = diffs.length === 0 ? (left + 1 <= config.maxDots ? left + 1 : left - 1) : left + diffs[Math.floor(Math.random() * diffs.length)];
                currentDotsToShow = { left, right };
            } else {
                currentDotsToShow = Math.floor(Math.random() * (config.maxDots - config.minDots + 1)) + config.minDots;
            }

            let currentTarget = config.compare ? (currentDotsToShow.left > currentDotsToShow.right ? 'LEFT' : 'RIGHT') : currentDotsToShow;

            // ターゲット指示文の作成
            let targetInstruction = "";
            if (config.distractor === 'color') {
                targetInstruction = `<span style="color:hsl(${baseColorH}, 100%, 60%); text-shadow: 0 0 3px #000, 0 0 1px #fff;">●(この色)</span>を数えろ: `;
            } else if (config.distractor === 'shape') {
                targetInstruction = `●(丸)を数えろ(■は無視): `;
            }

            // N-Backのロジック
            if (config.nBack > 0) {
                nBackHistory.push(currentTarget);
                if (nBackHistory.length <= config.nBack) {
                    correctCount = null; 
                    targetInfo.innerHTML = targetInstruction + `【記憶フェーズ ${nBackHistory.length}/${config.nBack}：次へ】`; 
                    isWaitingAnswer = false;
                } else {
                    correctCount = nBackHistory.shift(); 
                    targetInfo.innerHTML = targetInstruction + (config.compare ? `【${config.nBack}-Back：${config.nBack}つ前は？】` : `【${config.nBack}-Back：${config.nBack}つ前を答えろ】`); 
                    isWaitingAnswer = true;
                }
            } else {
                correctCount = currentTarget;
                if (config.compare) { targetInfo.innerHTML = targetInstruction + "【大小比較：どちらが多い？】"; }
                else { targetInfo.innerHTML = targetInstruction + (config.mode === 'levelup' ? "【LvUp挑戦中】" : "【玉の数】"); }
                isWaitingAnswer = true;
            }

            createAnswerUI();

            // ストループノイズ
            if (config.stroop && !config.compare) {
                const stroopDiv = document.createElement("div"); stroopDiv.id = "stroop-noise";
                let noiseVal; do { noiseVal = Math.floor(Math.random() * (config.maxDots - config.minDots + 1)) + config.minDots; } while (noiseVal === currentDotsToShow);
                stroopDiv.textContent = noiseVal; canvas.appendChild(stroopDiv);
            }

            const padding = 15, gap = 2;
            const drawSet = (targetCount, xOffset, width) => {
                // ディストラクター（妨害要素）の数を決定（最大設定値の0〜80%程度）
                let distCount = config.distractor !== 'off' ? Math.floor(Math.random() * (config.maxDots * 0.8)) + 1 : 0;
                let totalCount = targetCount + distCount;

                let dotSize = config.sizeMode === 'dynamic' ? (totalCount <= 1 ? 60 : (totalCount >= 100 ? 12 : 60 - (totalCount - 1) * (48 / 99))) : (totalCount > 30 ? 20 : (totalCount > 10 ? 35 : 50));
                dotSize *= totalCount > 50 ? 0.8 : 1.0;

                const localPlaced = [];
                let cols, rows, cellW, cellH;
                if (config.layoutPattern === 'grid') {
                    const aspect = width / canvas.clientHeight;
                    cols = Math.ceil(Math.sqrt(totalCount * aspect));
                    rows = Math.ceil(totalCount / cols);
                    cellW = (width - padding * 2) / cols;
                    cellH = (canvas.clientHeight - padding * 2) / rows;
                    dotSize = Math.min(dotSize, cellW * 0.8, cellH * 0.8);
                }

                // ターゲットとディストラクターの配列を作成してシャッフル
                let items = Array(targetCount).fill('target').concat(Array(distCount).fill('distractor'));
                for (let i = items.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [items[i], items[j]] = [items[j], items[i]];
                }

                for (let i = 0; i < totalCount; i++) {
                    const type = items[i];
                    let x, y, z = 0;
                    
                    if (config.layoutPattern === 'grid') {
                        const c = i % cols;
                        const r = Math.floor(i / cols);
                        x = xOffset + padding + c * cellW + (cellW - dotSize) / 2;
                        y = padding + r * cellH + (cellH - dotSize) / 2;
                        z = config.dimension === '3d' ? Math.random() * 400 - 200 : 0;
                    } else {
                        let overlap, attempts = 0;
                        do {
                            overlap = false;
                            x = xOffset + Math.random() * (width - dotSize - padding * 2) + padding;
                            y = Math.random() * (canvas.clientHeight - dotSize - padding * 2) + padding;
                            z = config.dimension === '3d' ? Math.random() * 400 - 200 : 0;
                            for (const dot of localPlaced) { if (Math.sqrt((dot.x - x)**2 + (dot.y - y)**2) < (dotSize + gap)) { overlap = true; break; } }
                            attempts++;
                        } while (overlap && attempts < 1000);
                        if (attempts >= 1000) continue;
                    }
                    
                    localPlaced.push({x, y, z});
                    const dot = document.createElement("div"); dot.className = "dot";
                    if (config.gabor) dot.classList.add("gabor");

                    let depthScale = config.dimension === '3d' ? 1 + (z / 400) : 1;
                    let brightness = config.dimension === '3d' ? 0.6 + ((z + 200) / 400) * 0.4 : 1;
                    dot.style.width = dot.style.height = `${dotSize * depthScale}px`;
                    dot.style.left = `${x}px`; dot.style.top = `${y}px`;

                    // ディストラクターの色/形の適用
                    let currentHue = baseColorH;
                    if (type === 'distractor') {
                        if (config.distractor === 'color') currentHue = (baseColorH + 180) % 360; // 補色
                        if (config.distractor === 'shape') {
                            dot.style.borderRadius = "15%"; // 四角形(少し角丸)に変更
                            if (config.gabor) {
                                dot.style.webkitMaskImage = "none";
                                dot.style.maskImage = "none";
                                dot.style.boxShadow = "inset 0 0 10px rgba(0,0,0,0.8)";
                            }
                        }
                    }

                    if (config.gabor && !(type === 'distractor' && config.distractor === 'shape')) {
                        const angle = Math.floor(Math.random() * 180);
                        const stripeColor = `hsl(${currentHue}, 100%, ${50 * brightness}%)`;
                        const bgColor = `hsl(${currentHue}, 100%, ${10 * brightness}%)`;
                        dot.style.background = `repeating-linear-gradient(${angle}deg, ${stripeColor}, ${stripeColor} 2px, ${bgColor} 2px, ${bgColor} 4px)`;
                    } else if (config.gabor && type === 'distractor' && config.distractor === 'shape') {
                        // ガボールパッチで四角形の場合（マスクなしの縞模様）
                        const angle = Math.floor(Math.random() * 180);
                        const stripeColor = `hsl(${currentHue}, 100%, ${50 * brightness}%)`;
                        const bgColor = `hsl(${currentHue}, 100%, ${10 * brightness}%)`;
                        dot.style.background = `repeating-linear-gradient(${angle}deg, ${stripeColor}, ${stripeColor} 2px, ${bgColor} 2px, ${bgColor} 4px)`;
                    } else {
                        dot.style.background = `radial-gradient(circle at 30% 30%, hsl(${currentHue},100%,${50*brightness+20}%), hsl(${currentHue},100%,${50*brightness}%), hsl(${currentHue},100%,${50*brightness-20}%))`;
                    }
                    if (config.dimension === '3d') dot.style.transform = `translateZ(${z}px)`;
                    canvas.appendChild(dot);
                }
            };

            if (config.compare) { const mid = canvas.clientWidth / 2; drawSet(currentDotsToShow.left, 0, mid); drawSet(currentDotsToShow.right, mid, mid); }
            else { drawSet(currentDotsToShow, 0, canvas.clientWidth); }

            if (config.flashTime < 10) {
                setTimeout(() => {
                    document.querySelectorAll(".dot, #stroop-noise").forEach(d => d.style.opacity = "0");
                    if (config.afterimage) { canvas.style.backgroundColor = "#FFF"; setTimeout(() => { canvas.style.backgroundColor = currentBg; applyMask(mask); }, 100); }
                    else { applyMask(mask); }
                }, config.flashTime * 1000);
            }
        }

        function applyMask(maskElement) {
            if (config.visualMask) { maskElement.style.display = "block"; setTimeout(() => { maskElement.style.display = "none"; }, 150); }
        }

        function createAnswerUI() {
            const container = document.getElementById("answerArea"); container.innerHTML = "";
            if (!isWaitingAnswer) return;
            if (config.compare) {
                container.className = "grid-compare";
                const btnL = createKey("LEFT (←)", () => checkAnswer('LEFT')); btnL.classList.add("btn-large");
                const btnR = createKey("RIGHT (→)", () => checkAnswer('RIGHT')); btnR.classList.add("btn-large");
                container.appendChild(btnL); container.appendChild(btnR); return;
            }
            const buttonCount = config.maxDots - config.minDots + 1;
            if (buttonCount >= 11) {
                container.className = "grid-keypad";
                const display = document.createElement("div"); display.id = "displayFieldValue"; display.textContent = "-"; container.appendChild(display);
                for (let i = 1; i <= 9; i++) container.appendChild(createKey(i, () => addNumber(i)));
                container.appendChild(createKey("C", backspace)); container.appendChild(createKey(0, () => addNumber(0)));
                const okBtn = createKey("決定", confirmAnswer); okBtn.style.background = "#00d2ff"; okBtn.style.color = "#000"; container.appendChild(okBtn);
            } else {
                container.className = "grid-small";
                for (let i = config.minDots; i <= config.maxDots; i++) container.appendChild(createKey(i, () => checkAnswer(i)));
            }
        }

        function createKey(text, action) {
            const btn = document.createElement("button"); btn.className = "btn-ans"; btn.textContent = text; btn.onclick = action; return btn;
        }

        function addNumber(num) {
            if (!isWaitingAnswer || isTransitioning) return;
            currentInput += num.toString(); document.getElementById("displayFieldValue").textContent = currentInput;
            if (currentInput.length >= correctCount.toString().length) setTimeout(confirmAnswer, 50);
        }

        function backspace() { currentInput = currentInput.slice(0, -1); document.getElementById("displayFieldValue").textContent = currentInput || "-"; }
        function confirmAnswer() { if (currentInput === "") return; checkAnswer(parseInt(currentInput)); }

        function checkAnswer(selected) {
            if (!isWaitingAnswer || isTransitioning) return;
            const msg = document.getElementById("msg");
            if (selected === correctCount) {
                if (msg.textContent === "") combo++;
                if (config.mode === 'levelup' && combo > 0 && combo % 10 === 0) {
                    config.minDots++; config.maxDots++;
                    document.getElementById('minDots').value = config.minDots; document.getElementById('maxDots').value = config.maxDots;
                    msg.textContent = "LEVEL UP!"; msg.style.color = "#00FF00";
                    setTimeout(() => { updateStats(); generateNewProblem(); }, 800); return;
                }
                updateStats(); generateNewProblem();
            } else {
                combo = 0; updateStats();
                msg.textContent = config.compare ? `ハズレ！` : `正解は ${correctCount}`; msg.style.color = "#FF4500"; currentInput = "";
                if (document.getElementById("displayFieldValue")) document.getElementById("displayFieldValue").textContent = "-";
                if (config.nBack > 0) {
                    nBackHistory = [];
                    setTimeout(() => { alert("不正解のため、記憶をリセットして最初からやり直します。"); }, 100);
                }
            }
        }
        function updateStats() { document.getElementById("stats").textContent = `Combo: ${combo}`; }
    </script>
</body>
</html>
